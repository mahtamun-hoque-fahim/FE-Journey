<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Note App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header__top">
      <h1>My Note App</h1>
      <button type="button" id="settingsBtn" class="btn btn--icon" aria-label="Open settings">
        <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
        </svg>
      </button>
    </div>
    <p class="header__subtitle">Capture ideas and keep them in your browser.</p>
  </header>

  <main class="main">
    <section id="notesView" class="view">
      <section class="note-form" aria-label="Add a new note">
        <label class="note-form__label" for="noteInput">New note</label>
        <textarea
          id="noteInput"
          class="note-form__input"
          placeholder="Write your note here..."
          rows="4"
        ></textarea>
        <button type="button" id="addNoteBtn" class="btn btn--primary">Add Note</button>
      </section>

      <section class="notes" aria-label="Your notes">
        <h2 class="notes__heading">Your Notes</h2>
        <ul id="notesList" class="notes__list"></ul>
        <p id="emptyState" class="notes__empty">No notes yet. Add one above to get started.</p>
      </section>
    </section>

    <section id="settingsView" class="view view--hidden" aria-label="Settings">
      <div class="settings">
        <div class="settings__header">
          <button type="button" id="backBtn" class="btn btn--ghost">
            <svg class="btn__icon btn__icon--left" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back
          </button>
          <h2 class="settings__heading">Settings</h2>
        </div>

        <div class="settings__group">
          <h3 class="settings__group-title">Appearance</h3>
          <label class="settings__row">
            <span class="settings__label">Dark mode</span>
            <input type="checkbox" id="darkModeToggle" class="settings__toggle">
          </label>
        </div>

        <div class="settings__group">
          <h3 class="settings__group-title">Notes</h3>
          <label class="settings__row">
            <span class="settings__label">Sort order</span>
            <select id="sortOrderSelect" class="settings__select">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </label>
        </div>

        <div class="settings__group">
          <h3 class="settings__group-title">Data</h3>
          <div class="settings__row settings__row--action">
            <div>
              <span class="settings__label">Clear all notes</span>
              <p class="settings__hint">Permanently delete every saved note.</p>
            </div>
            <button type="button" id="clearNotesBtn" class="btn btn--danger">Clear All</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
